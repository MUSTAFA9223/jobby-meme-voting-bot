name: Deploy JOBBY to Cloudflare
on:
  workflow_dispatch:
    inputs:
      run_x_media_smoke:
        description: Fetch a real X image through the Worker and deliver a private Telegram preview
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: jobby-meme-voting-state
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JOBBY_BOT_TOKEN: ${{ secrets.JOBBY_BOT_TOKEN }}
      JOBBY_ADMIN_IDS: ${{ secrets.JOBBY_ADMIN_IDS }}
      STATE_KEY: ${{ secrets.JOBBY_STATE_KEY }}
      DB_PATH: /tmp/jobby_migration.sqlite3
      JOBBY_REQUIRED_CHAT_ID: ${{ vars.JOBBY_REQUIRED_CHAT_ID }}
      JOBBY_X_MEDIA_SMOKE: ${{ inputs.run_x_media_smoke }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required credentials
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN JOBBY_BOT_TOKEN JOBBY_ADMIN_IDS STATE_KEY; do
            if [ -z "${!name}" ]; then echo "Required credential missing: $name"; exit 1; fi
          done
      - name: Test both implementations
        run: |
          python -m unittest discover -s tests
          node --test cloudflare/test/*.test.js
      - name: Restore encrypted contest state
        run: |
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in .github/jobby_state.enc -out "$DB_PATH" -pass env:STATE_KEY
      - name: Install deployment CLI
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate, deploy and verify webhook
        run: python cloudflare/deploy.py
      - name: Remove decrypted snapshot
        if: always()
        run: rm -f "$DB_PATH"
